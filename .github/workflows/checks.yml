name: Checks

on:
  push:
  pull_request:

jobs:
  data:
    name: Data, route, engine and service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data in sync with index.html
        run: |
          node tools/extract.mjs
          git diff --exit-code data/
      - name: Page order and every plan's route pass every requirement
        run: node solver/solve.mjs --check
      - name: Route file is current
        run: |
          node solver/solve.mjs
          git diff --exit-code ROUTE.md data/route-solved.json
      - name: Service worker version matches the shell files
        run: node tools/stamp-sw.mjs --check
      - name: Engine unit tests (Draw Support rules, stat planner, route)
        run: npm run test:unit

  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build-artifact.mjs
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
